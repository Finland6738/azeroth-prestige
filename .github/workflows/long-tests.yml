name: Long tests

# The long scenarios of the offline tests (Tests/run_tests.py --long): the network simulator with many complete clients
# on a mega-realm (SPEC-06, from milestone M4), the weekly apex assignment over thousands of profiles (SPEC-07, M6) and
# the saved-data size limits (SPEC-04 §10.3). They run when the network layer, the simulator or the harness change,
# every Monday, and on request; the CI workflow ("Tests") stays quick. Until Tests/run_tests.py exists (M1.3) the job
# says so and passes.
on:
  pull_request:
    paths:
      - "AzerothPrestige/Network/**"
      - "AzerothPrestige/Domain/**"
      - "AzerothPrestige/Core/Compat.lua"
      - "Tests/sim/**"
      - "Tests/lib/**"
      - "Tests/run_tests.py"
      - ".github/workflows/long-tests.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: long-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  long:
    name: Long tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Say there is nothing to run yet
        if: hashFiles('Tests/run_tests.py') == ''
        run: echo "::notice title=No long tests yet::Tests/run_tests.py arrives in step M1.3."

      - name: Set up Python
        if: hashFiles('Tests/run_tests.py') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache the libraries
        if: hashFiles('Tests/run_tests.py') != ''
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: AzerothPrestige/Libs
          key: libs-${{ hashFiles('.pkgmeta', 'tools/fetch_libs.py') }}

      - name: Run the long scenarios
        if: hashFiles('Tests/run_tests.py') != ''
        run: |
          python -m pip install lupa==2.8
          python -I -X utf8 tools/fetch_libs.py
          python -I -X utf8 Tests/run_tests.py --long
