name: Feature request
description: Suggest a new feature or an improvement for Azeroth Prestige.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Azeroth Prestige rewards completed activities with cosmetic ranks only: it never gives a gameplay advantage and never gates groups by rank.
        **Privacy:** do not paste other players' names, whispers, chat logs, account names or folder paths from your PC.
        For an open conversation before writing a formal request, you can also start a topic in the [Feedback discussions](https://github.com/Finland6738/azeroth-prestige/discussions/categories/feedback).
  - type: dropdown
    id: category
    attributes:
      label: Which part?
      options:
        - A category (Vanguard, Delver, Pathfinder, Adventurer, Diplomat, Artisan, Merchant, Steward)
        - Global Prestige, apex ranks or leaderboards
        - Badges and profile
        - Celebrations
        - Settings, languages or accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The situation in game where you missed it.
    validations:
      required: true
