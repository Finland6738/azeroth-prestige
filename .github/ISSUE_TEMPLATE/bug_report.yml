name: Bug report
description: Something in Azeroth Prestige does not work as expected.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Azeroth Prestige.
        **Privacy:** do not paste other players' names, whispers, chat logs, account names or folder paths from your PC. Replace them with placeholders such as `<player>`, `<guild>` or `<account>`.
        Not sure it is a bug, or just want to share feedback? Use the [Feedback discussions](https://github.com/Finland6738/azeroth-prestige/discussions/categories/feedback) instead.
  - type: input
    id: version
    attributes:
      label: Addon version
      description: The `addon:` line at the top of the `/azp debug` report, or the AddOns list at the character screen.
      placeholder: "0.x.y"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Game client
      description: The `client:` and `locale:` lines of the `/azp debug` report. WoW Forever build and game language.
      placeholder: "1.60.1 (build 70170), enUS"
    validations:
      required: true
  - type: dropdown
    id: realm
    attributes:
      label: Realm type
      description: The ruleset of the realm where it happened.
      options:
        - Normal
        - PvP
        - RP
        - RP-PvP
        - Hardcore
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Points and ranks (a category did not count an activity)
        - Badges (nameplate, tooltip, chat, frames)
        - Profile, history or settings
        - Leaderboards, apex ranks or Hall of Prestige
        - Celebrations and sounds
        - Network (profiles of other players)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Type /prestige and open the History tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The /azp debug report (please paste it whole)
      description: |
        Type `/azp debug` in the game: the report opens in a box, already selected. Press Ctrl+C and paste it here, whole: it starts with the version, client, language and realm type, and then holds the restrictions state, the network queue, the sizes of the saved data, the memory and the last addon errors. It contains no player or guild names, and names in an error text are replaced by placeholders. If the game also showed a Lua error box, paste its text too. Remove anything else you do not want to share.
      render: text
