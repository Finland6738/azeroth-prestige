; Copy this file to tools/local.ini (git-ignored) and adjust it. Nothing in local.ini ever enters the repository.
[paths]
; where tools/install_addon.py (M1.2) and tools/install_probe.py (M0.2) copy the addon and the probe
addons = <WoW folder>/_forever_/Interface/AddOns

[privacy]
; Real names that must never appear in a tracked file: tools/check_docs.py fails on any of them, as a whole word,
; case-insensitive, without printing it. One per line or comma separated, at least three letters each.
names =
